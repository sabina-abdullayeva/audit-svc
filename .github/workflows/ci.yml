name: test-build-deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/audit-svc

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: poetry

      - name: Install Poetry
        run: pip install "poetry==2.5.1"

      - name: Install project
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest --junitxml=test-report.xml

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: test-report.xml

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Choose image tag
        id: image
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main_${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable ARM64 build
        uses: docker/setup-qemu-action@v3

      - name: Prepare Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        if: github.ref_type != 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Для тега не собираем тот же код второй раз. Новый тег указывает на
      # готовый образ main_<sha>, поэтому digest остаётся тем же.
      - name: Publish release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${GITHUB_REF_NAME}" \
            "${IMAGE_NAME}:main_${GITHUB_SHA::8}"

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - deploy
    environment: production
    env:
      ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Login to GHCR on deploy machine
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r deploy/requirements.yml

      - name: Deploy release
        run: |
          chmod 700 deploy/vault-pass.sh
          ansible-playbook \
            -i deploy/inventories/prod/hosts.yaml \
            deploy/audit-svc.play.yml \
            --vault-password-file deploy/vault-pass.sh \
            --extra-vars "audit_image=${IMAGE_NAME}:${GITHUB_REF_NAME}"

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Метрики приложения получаем только через Nginx.
  - job_name: audit-svc
    metrics_path: /metrics
    static_configs:
      - targets:
          - nginx:8080

  - job_name: nginx
    static_configs:
      - targets:
          - nginx-exporter:9113
